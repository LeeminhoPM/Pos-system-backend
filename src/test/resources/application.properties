# Test Environment Configuration
spring.application.name=pos-system-test
spring.profiles.active=test
server.port=0

# In-Memory H2 Database with MySQL Mode
spring.datasource.url=jdbc:h2:mem:postestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Settings for Test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Disable Flyway for In-Memory H2 Tests
spring.flyway.enabled=false
spring.data.redis.repositories.enabled=false
spring.cache.type=simple

# Security & JWT for Testing
pos.jwt.secret=test_secret_key_at_least_64_characters_for_hmac_sha512_security_pos_system_unit_test
pos.jwt.expiration-ms=3600000

# CORS for Testing
pos.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging for Testing
logging.level.root=WARN
logging.level.com.bluesky.pos_system=INFO
logging.level.org.springframework.security=WARN
