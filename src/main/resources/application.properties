spring.application.name=pos-system

# Server Configuration
server.port=${SERVER_PORT:5000}
server.servlet.context-path=

# Database Configuration (Parameterized with Environment Variables & Fallbacks)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/pos_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Security & JWT Properties
pos.jwt.secret=${JWT_SECRET:zntuceyczbzgazycopqqwvryithxbewcymywpyqcehlpgxzwowgmqsmizmvremjncvqxqrnjwoidanptqzxomilyhmeeclqobxjipuxzegyfrqxevrekglqkjgnhgnsmhaqofiycmqqgrpcnznebbyvajqclvqzw}
pos.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
pos.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging Configuration
logging.level.root=INFO
logging.level.com.bluesky.pos_system=DEBUG
logging.level.org.springframework.security=WARN