spring.application.name=pos-system

# Server & Graceful Shutdown
server.port=${SERVER_PORT:5000}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# API Response Compression (Gzip) for Network & Mobile Performance
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Database Configuration (Parameterized with Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/pos_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP High-Performance Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=2000
spring.datasource.hikari.pool-name=SkyPOS-HikariCP-Pool

# MySQL JDBC Prepared Statement Caching & Batching Optimization
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-properties.maintainTimeStats=false

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Database Query Performance & Statistics Monitoring
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=100

# Flyway Database Migration
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Redis Cache Settings
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

# Actuator & Prometheus Metrics Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.enable.hikaricp=true
management.metrics.enable.jdbc=true

# Security & JWT Properties
pos.jwt.secret=${JWT_SECRET:zntuceyczbzgazycopqqwvryithxbewcymywpyqcehlpgxzwowgmqsmizmvremjncvqxqrnjwoidanptqzxomilyhmeeclqobxjipuxzegyfrqxevrekglqkjgnhgnsmhaqofiycmqqgrpcnznebbyvajqclvqzw}
pos.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
pos.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging Configuration
logging.level.root=INFO
logging.level.com.bluesky.pos_system=DEBUG
logging.level.org.springframework.security=WARN