# ========================================================
# SkyPOS Profile: PROD (Production Hardened)
# ========================================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none

# Strict Flyway migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Graceful shutdown settings
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# High-Performance HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=SkyPosHikariProdPool

# Security & Secrets: Strictly required from environment
pos.jwt.secret=${JWT_SECRET}
pos.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
pos.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging: Minimal production logs
logging.level.root=WARN
logging.level.com.bluesky.pos_system=INFO
logging.level.org.springframework.security=ERROR

# Actuator: Only expose health and prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
