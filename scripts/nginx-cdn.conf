# ========================================================
# Production Nginx Configuration with CDN & Edge Caching
# Optimized for POS High-Volume Single Page Application & API
# ========================================================

server {
    listen 80;
    listen [::]:80;
    server_name pos.bluesky.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.bluesky.vn;

    ssl_certificate /etc/letsencrypt/live/pos.bluesky.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.bluesky.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip / Brotli Compression at Edge Reverse Proxy
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    root /usr/share/nginx/html;

    # 1. Hashed Static Assets (Vite Chunks, Fonts, Icons) -> Aggressive CDN Cache
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 2. SPA Entry Point (index.html) -> Always Fresh, Never Stale
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # 3. Dynamic Backend API (/api/*) & Actuator (/actuator/*) -> Pass Through
    location /api/ {
        proxy_pass http://pos-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable caching on dynamic transactional APIs
        add_header Cache-Control "no-store, no-cache, private";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /actuator/ {
        proxy_pass http://pos-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
