global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'skypos-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['pos-backend:5000', 'host.docker.internal:5000']
        labels:
          application: 'skypos-system'
