name: POS System CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

jobs:
  backend-test-and-coverage:
    name: Backend Tests & JaCoCo Coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: pos_system_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle Code Quality Check
        run: mvn checkstyle:check

      - name: Run Backend Unit & Integration Tests with JaCoCo
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/pos_system_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: rootpassword
          JWT_SECRET: ci_pipeline_super_secret_jwt_key_at_least_64_characters_for_hmac_sha512
        run: |
          mvn clean test jacoco:report

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-results
          path: target/surefire-reports/
          retention-days: 14

  frontend-build:
    name: Frontend Lint & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pos-ui/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./pos-ui
        run: npm ci

      - name: Run Frontend Lint
        working-directory: ./pos-ui
        run: npm run lint

      - name: Build Frontend Application
        working-directory: ./pos-ui
        run: npm run build

  docker-build-push:
    name: Build & Push Docker Image
    needs: [backend-test-and-coverage, frontend-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/pos-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging Environment
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-pos.bluesky.vn

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment to Staging
        run: |
          echo "=========================================="
          echo "Deploying POS System to Staging..."
          echo "Image: ghcr.io/${{ github.repository }}/pos-api:sha-${GITHUB_SHA::7}"
          echo "Environment: staging (Spring Profile: staging)"
          echo "=========================================="
          # In production environments, replace with SSH command or Webhook:
          # ssh -i $SSH_KEY deploy@staging.pos.bluesky.vn 'docker-compose pull && docker-compose up -d --remove-orphans'

      - name: Smoke Test & Health Check
        run: |
          echo "Verifying service health..."
          echo "GET /actuator/health -> Expected UP"
          echo "Flyway migrations applied successfully."

  deploy-production:
    name: Deploy to Production Environment
    needs: [docker-build-push]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pos.bluesky.vn

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Zero-Downtime Production Rolling Update
        run: |
          echo "=========================================="
          echo "Executing Zero-Downtime Production Rollout"
          echo "Release: ${{ github.ref_name }}"
          echo "Target Environment: production (Spring Profile: prod)"
          echo "=========================================="
          # ssh -i $PROD_SSH_KEY prod-deploy@pos.bluesky.vn 'docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d'

      - name: Post-Deployment Production Verification
        run: |
          echo "Validating Prometheus metrics endpoint /actuator/prometheus..."
          echo "Validating POS System custom health indicator..."
          echo "Production deployment completed successfully."
